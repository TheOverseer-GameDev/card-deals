name: ops checks
on:
  pull_request:
  push:
jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: helper and production call-site tests
        run: |
          python3 -m unittest discover -s ops -p 'test_*.py'
          python3 -m py_compile ops/deploy/ygo_cards/tracker.py ops/deploy/ygo_cards/verify.py ops/deploy/card_ops/doctor.py ops/deploy/mtg_cards/tracker.py
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: browser for the scan suites
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ffmpeg
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
      - name: scanner tests
        run: node --test --test-concurrency=1 scan/test/*.js
