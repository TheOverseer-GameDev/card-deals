 $('#tg').height=cs.length*20+40;new Chart($('#tg'),{type:'bar',data:{labels:cs.map(c=>c.name.slice(0,26)),datasets:[{data:cs.map(c=>c.t12||0),backgroundColor:cs.map(c=>(c.t12||0)>=0?'#3ddc97':'#ff6b6b')}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b95b0'}},y:{ticks:{color:'#e8ecf6',font:{size:10}}}}}})}
$('#q').oninput=ev=>{Q=ev.target.value.trim().toLowerCase();render()};$('#so').onchange=ev=>{SO=ev.target.value;render()};
document.addEventListener('click',ev=>{const t=ev.target;
 const gb=t.closest('.gt button');if(gb){G=gb.dataset.g;document.querySelectorAll('.gt button').forEach(b=>b.classList.toggle('on',b==gb));render();return}
 const lb=t.closest('.st3 button');if(lb){LS=lb.dataset.l;document.querySelectorAll('.st3 button').forEach(b=>b.classList.toggle('on',b==lb));render();return}
 const ch=t.closest('.chip[data-b]');if(ch){BF=ch.dataset.b;render();return}
 const b=t.closest('nav button');if(b){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));$('#lists').style.display=b.dataset.v=='lists'?'':'none';['coll','alerts','trends','wish'].forEach(v=>$('#v-'+v).classList.toggle('on',v==b.dataset.v));scrollTo({top:0});if(b.dataset.v=='trends')trends();return}
 const q=t.closest('.rq');if(q){req(D[q.dataset.k].cards[q.dataset.i],q.dataset.k);return}const x=t.closest('[data-del]');if(x){W.splice(+x.dataset.del,1);sv();return}const sh=t.closest('[data-sh]');if(sh){send(W[+sh.dataset.sh].t);return}
 if(t.closest('a')||t.closest('.rg'))return;const c=t.closest('.c[data-k]');if(!c)return;const cd=D[c.dataset.k].cards[c.dataset.i];
 if(desk()){document.querySelectorAll('.c.sel').forEach(z=>z.classList.remove('sel'));c.classList.add('sel');const P=$('#panel');P.innerHTML=c.innerHTML;P.querySelector('.det').style.display='block';chart(P,cd,c.dataset.k);return}
 c.classList.toggle('open');chart(c,cd,c.dataset.k)});
const PH=document.documentElement.classList.contains('phone');$('#vt').textContent=PH?'🖥 PC view':'📱 Phone view';$('#vt').onclick=()=>{localStorage.setItem('view',PH?'desktop':'phone');location.reload()};
const desk=()=>!PH&&matchMedia('(min-width:900px)').matches;
function loadWish(){try{const v=JSON.parse(localStorage.getItem('wish')||'[]');return Array.isArray(v)?v.filter(w=>w&&typeof w==='object'):[]}catch{return []}}
let W=loadWish();
function sv(){localStorage.setItem('wish',JSON.stringify(W));$('#v-wish').innerHTML=(W.length?W.map((w,i)=>`<div class="c"><div class="meta">${e(w.d)}</div><div class="nm">${e(w.n)}</div><div class="meta">${e(w.p)}</div>${targetBox(w.n)}<div class="btns"><button class="btn" data-sh="${i}" style="border:0">Share / copy</button><button class="btn g" data-del="${i}" style="border:0">Remove</button></div></div>`).join(''):'<div class="empty">Tap ⭐ Request purchase on any card to save it here.</div>')+'<div class="note">Saved only on this phone. Sharing just sends text; nothing is bought.</div>'}
document.addEventListener('input',ev=>{const t=ev.target.closest('[data-target]');if(!t)return;TARGETS[t.dataset.target]=t.value;saveTargets()});
document.addEventListener('click',ev=>{if(ev.target.id!=='export-local')return;const cell=v=>{let t=v==null?'':String(v).normalize('NFKC');t=t.replace(/\p{Cf}/gu,'');t=t.replace(/^(?:\p{Z}|\p{Cc})+/u,'');if(/^[=\+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};const lines=['list,name,detail,target'];(D.coll||[]).forEach(r=>lines.push(['Mine',r.name,r.set_code,TARGETS[r.name]||''].map(cell).join(',')));W.forEach(w=>lines.push(['Wishlist',w.n,w.p,TARGETS[w.n]||''].map(cell).join(',')));const box=$('#local-csv');box.hidden=false;box.value=lines.join('\n')});
function toast(t){const d=Object.assign(document.createElement('div'),{textContent:t});d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#d4af37;color:#111;padding:10px 16px;border-radius:20px;font-weight:600;z-index:20;transition:opacity .4s';document.body.appendChild(d);setTimeout(()=>d.style.opacity=0,1600);setTimeout(()=>d.remove(),2100)}
async function send(t){try{if(navigator.share){await navigator.share({title:'Card purchase request',text:t});return}}catch(_){return}try{await navigator.clipboard.writeText(t);toast('Copied, paste it to your bot')}catch(_){prompt('Copy this:',t)}}
function req(c,k){const l=offer(c),p=l?`Live ${l.cad_total!=null?'C$'+(+l.cad_total).toFixed(2):m(l.price)+' USD'}`:`Raw sold ${guideCad(c.raw)}`,t=`Purchase request (${k=='ygo'?'Yu-Gi-Oh':'Magic'}): ${c.name}\nPrint/details: ${l?l.title||'':''}\nPrice: ${p} (raw ${guideCad(c.raw)} / PSA 9 ${guideCad(c.p9)} / PSA 10 ${guideCad(c.p10)})\nBuy zone: ≤ ${guideCad(c.buy)}\nLink: ${l&&itemUrl(l)?l.url:'no verified listing'}\nPlease verify print, condition and total cost in CAD before buying.`;
 W.unshift({n:c.name,p:p,t:t,d:new Date().toLocaleDateString('en-CA')});sv();toast('Added to Wishlist');send(t)}
sv();
const VER='__V__';
(async()=>{try{const r=await fetch('version.json?'+Date.now(),{cache:'no-store'}),j=await r.json();if(j.v!==VER&&!sessionStorage.getItem('rl'+j.v)){sessionStorage.setItem('rl'+j.v,1);if(window.caches)for(const k of await caches.keys())await caches.delete(k);const g=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();g&&await g.update();location.reload()}}catch(_){}})();
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{if(!r||typeof r.update!='function')return;const refresh=()=>r.update().catch(()=>{});refresh();document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()})}).catch(()=>{});
 let rl;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl&&!sessionStorage.getItem('cc'+VER)){rl=1;sessionStorage.setItem('cc'+VER,1);location.reload()}})}
