<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Card Deals</title>
<style>
:root{--bg:#0b0f1a;--card:#141a2b;--line:#222b44;--tx:#e8ecf6;--mu:#8b95b0;--gold:#d4af37;--up:#3ddc97;--dn:#ff6b6b}
button{font-family:inherit}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;padding:14px 18px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
h1{margin:0;font-size:22px;letter-spacing:.3px}h1 b{color:var(--gold)}.sub{color:var(--mu);font-size:12.5px;margin-top:2px}
main{padding:0 14px}.view{display:none;animation:f .25s ease}.view.on{display:block}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.banner{background:#3a2a0a;color:#ffd77a;border:1px solid #6b4d12;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:6px 0 12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;transition:transform .15s}.c:active{transform:scale(.99)}
.top{display:flex;gap:12px;align-items:flex-start}.rk{flex:0 0 34px;height:34px;border-radius:10px;background:#1f2740;color:var(--gold);display:grid;place-items:center;font-weight:700}
.nm{font-weight:600;font-size:16.5px}.meta{color:var(--mu);font-size:13px;margin-top:3px}.sc{margin-left:auto;text-align:right}.sc b{font-size:20px;color:var(--gold)}.sc small{display:block;color:var(--mu);font-size:11px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.st{background:#0f1424;border-radius:10px;padding:8px;text-align:center}.st small{display:block;color:var(--mu);font-size:11px}.st b{font-size:15px}
.up{color:var(--up)}.dn{color:var(--dn)}.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:#163a2b;color:var(--up);margin-left:6px;vertical-align:middle}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;height:46px;border-radius:12px;background:var(--gold);color:#111;font-weight:700;text-decoration:none}
.btn.g{background:#1f2740;color:var(--tx)}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.det{max-height:0;overflow:hidden;transition:max-height .35s ease}.c.open .det{max-height:900px}canvas{margin-top:12px}
.note{color:var(--mu);font-size:12px;margin-top:10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(14,19,33,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
nav button span{font-size:21px}nav button.on{color:var(--gold)}.empty{color:var(--mu);text-align:center;padding:40px 10px}
</style></head><body>
<header><h1>Card <b>Deals</b></h1><div class="sub" id="sub"></div></header>
<main><section class="view on" id="v-ygo"></section><section class="view" id="v-mtg"></section><section class="view" id="v-coll"></section><section class="view" id="v-alerts"></section><section class="view" id="v-trends"></section><section class="view" id="v-wish"></section></main>
<nav><button data-v="ygo" class="on"><span>🐉</span>Yu-Gi-Oh</button><button data-v="mtg"><span>🧙</span>Magic</button><button data-v="coll"><span>🗂️</span>Mine</button><button data-v="alerts"><span>🔔</span>Alerts</button><button data-v="wish"><span>⭐</span>Wishlist</button><button data-v="trends"><span>📈</span>Trends</button></nav>
<script src="chart.min.js?1793895380" defer></script><script src="data.js?1793895380"></script>
<script>
const $=s=>document.querySelector(s),m=v=>v==null||!v?'–':'$'+(v>=1000?Math.round(v).toLocaleString():(+v).toFixed(v<100?2:0)),
p=v=>v==null?'–':`<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${Math.round(v)}%</span>`,e=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
$('#sub').textContent='Updated '+D.built+' · prices USD · advice only, never auto-buys';
function list(k){const d=D[k];let h=d.sample?'<div class="banner">SAMPLE data: this tracker has not produced results yet. Real picks appear after its first run.</div>':'';
 if(!d.cards.length)return h+'<div class="empty">No picks yet.</div>';
 d.cards.forEach((c,i)=>{h+=`<div class="c" data-k="${k}" data-i="${i}"><div class="top"><div class="rk">${i+1}</div><div><div class="nm">${e(c.name)}${c.deal?'<span class="tag">BUY ZONE</span>':''}</div>
 <div class="meta">12-mo raw ${p(c.t12)} · PSA 10 ${p(c.t12g)}</div></div><div class="sc"><b>${Math.round(c.score)}</b><small>score</small></div></div>
 <div class="row"><div class="st"><small>Raw</small><b>${m(c.raw)}</b></div><div class="st"><small>PSA 9</small><b>${m(c.p9)}</b></div><div class="st"><small>PSA 10</small><b>${m(c.p10)}</b></div></div>
 <div class="btns">${c.lr?`<a class="btn" href="${e(c.lr.url)}" target="_blank" rel="noopener">Raw ${m(c.lr.price)} ↗</a>`:'<a class="btn g">No live raw</a>'}${c.lg?`<a class="btn g" href="${e(c.lg.url)}" target="_blank" rel="noopener">PSA 10 ${m(c.lg.price)} ↗</a>`:'<a class="btn g">No live PSA 10</a>'}</div>
 <button class="btn g rq" style="width:100%;border:1px solid var(--gold);color:var(--gold);font-size:15px" data-k="${k}" data-i="${i}">⭐ Request purchase</button><div class="det"><div class="row"><div class="st"><small>3 mo</small><b>${p(c.t3)}</b></div><div class="st"><small>6 mo</small><b>${p(c.t6)}</b></div><div class="st"><small>Buy zone ≤</small><b>${m(c.buy)}</b></div></div>
 <canvas height="190"></canvas><div class="note">Sold-price history (PriceCharting). Gold dashed = buy zone. Live listings are cheapest eBay Buy It Now at run time and may be a different print or condition, so check before buying.${c.url?` <a style="color:var(--gold)" href="${e(c.url)}" target="_blank">Sold data ↗</a>`:''}</div></div></div>`});return h}
function chart(el,c){if(el.dataset.done||!window.Chart)return;el.dataset.done=1;const H=c.hist||{},col={raw:'#7aa2ff',p9:'#3ddc97',p10:'#d4af37'},nm={raw:'Raw',p9:'PSA 9',p10:'PSA 10'};
 const ds=Object.keys(col).filter(k=>H[k]&&H[k].length).map(k=>({label:nm[k],data:H[k].map(([t,v])=>({x:t,y:v})),borderColor:col[k],pointRadius:0,tension:.3,borderWidth:2}));
 if(!ds.length){el.replaceWith(Object.assign(document.createElement('div'),{className:'note',textContent:'No price history yet.'}));return}
 if(c.buy){const xs=ds[0].data;ds.push({label:'Buy zone',data:[{x:xs[0].x,y:c.buy},{x:xs[xs.length-1].x,y:c.buy}],borderColor:'#d4af37',borderDash:[5,5],pointRadius:0,borderWidth:1})}
 new Chart(el,{type:'line',data:{datasets:ds},options:{animation:{duration:300},parsing:false,scales:{x:{type:'linear',ticks:{color:'#8b95b0',maxTicksLimit:5,callback:v=>new Date(v).toLocaleDateString('en-CA',{month:'short',year:'2-digit'})},grid:{color:'#1a2136'}},y:{type:'logarithmic',ticks:{color:'#8b95b0',maxTicksLimit:5,callback:v=>'$'+v},grid:{color:'#1a2136'}}},plugins:{legend:{labels:{color:'#e8ecf6',boxWidth:10}}}}})}
$('#v-ygo').innerHTML=list('ygo');$('#v-mtg').innerHTML=list('mtg');
$('#v-coll').innerHTML=D.coll.length?D.coll.map(r=>`<div class="c"><div class="nm">${e(r.name)}</div><div class="meta">${e(r.set_code)} · ${e(r.rarity)} · ${e(r.condition)}</div></div>`).join('')+'<div class="note">Add cards in ygo_cards/my_collection.csv.</div>':'<div class="empty">No cards in your collection yet.</div>';
$('#v-alerts').innerHTML=D.alerts.length?D.alerts.map(a=>`<a class="c" style="display:block;color:inherit;text-decoration:none" href="${e(a.u)}" target="_blank"><div class="meta">${e(a.g)} · ${e(a.t)}</div><div class="nm">${e(a.name)}</div><div class="meta">${e(a.msg)}</div></a>`).join(''):'<div class="empty">No alerts right now.</div>';
$('#v-trends').innerHTML='<div class="c"><div class="nm">Score by card (YGO)</div><canvas id="tc" height="'+(D.ygo.cards.length*18+40)+'"></canvas></div><div class="c"><div class="nm">12-month raw change</div><canvas id="tg" height="'+(D.ygo.cards.length*18+40)+'"></canvas></div>';
let trDone;function trends(){if(trDone||!window.Chart)return;trDone=1;const cs=D.ygo.cards.concat(D.mtg.sample?[]:D.mtg.cards),lb=cs.map(c=>c.name.replace(/\[1st Edition\]/,'1st').slice(0,26)),o={indexAxis:'y',animation:{duration:300},plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b95b0'},grid:{color:'#1a2136'}},y:{ticks:{color:'#e8ecf6',font:{size:10}},grid:{display:false}}}};
 new Chart($('#tc'),{type:'bar',data:{labels:lb,datasets:[{data:cs.map(c=>c.score),backgroundColor:'#d4af37'}]},options:o});
 new Chart($('#tg'),{type:'bar',data:{labels:lb,datasets:[{data:cs.map(c=>c.t12||0),backgroundColor:cs.map(c=>(c.t12||0)>=0?'#3ddc97':'#ff6b6b')}]},options:o})}
document.addEventListener('click',ev=>{const b=ev.target.closest('nav button');if(b){document.querySelectorAll('nav button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#v-'+b.dataset.v).classList.add('on');scrollTo({top:0});if(b.dataset.v=='trends')trends();return}
 const q=ev.target.closest('.rq');if(q){req(D[q.dataset.k].cards[q.dataset.i],q.dataset.k);return}const x=ev.target.closest('[data-del]');if(x){W.splice(+x.dataset.del,1);sv();return}const sh=ev.target.closest('[data-sh]');if(sh){send(W[+sh.dataset.sh].t);return}if(ev.target.closest('a'))return;const c=ev.target.closest('.c[data-k]');if(c){c.classList.toggle('open');const cv=c.querySelector('canvas');cv&&chart(cv,D[c.dataset.k].cards[c.dataset.i])}});
let W=JSON.parse(localStorage.getItem('wish')||'[]');
function sv(){localStorage.setItem('wish',JSON.stringify(W));$('#v-wish').innerHTML=(W.length?W.map((w,i)=>`<div class="c"><div class="meta">${e(w.d)}</div><div class="nm">${e(w.n)}</div><div class="meta">${e(w.p)}</div><div class="btns"><button class="btn" data-sh="${i}" style="border:0">Share / copy</button><button class="btn g" data-del="${i}" style="border:0">Remove</button></div></div>`).join(''):'<div class="empty">Tap ⭐ Request purchase on any card to save it here.</div>')+'<div class="note">Saved only on this phone. Sharing just sends text; nothing is bought.</div>'}
function toast(t){const d=Object.assign(document.createElement('div'),{textContent:t});d.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#d4af37;color:#111;padding:10px 16px;border-radius:20px;font-weight:600;z-index:20;transition:opacity .4s';document.body.appendChild(d);setTimeout(()=>d.style.opacity=0,1600);setTimeout(()=>d.remove(),2100)}
async function send(t){try{if(navigator.share){await navigator.share({title:'Card purchase request',text:t});return}}catch(_){return}try{await navigator.clipboard.writeText(t);toast('Copied, paste it to your bot')}catch(_){prompt('Copy this:',t)}}
function req(c,k){const l=c.lr||c.lg,p=l?`Live ${m(l.price)} USD`:`Raw sold ${m(c.raw)} USD`,t=`Purchase request (${k=='ygo'?'Yu-Gi-Oh':'Magic'}): ${c.name}\nPrint/details: ${l?l.title||'':''}\nPrice: ${p} (raw ${m(c.raw)} / PSA 9 ${m(c.p9)} / PSA 10 ${m(c.p10)})\nBuy zone: ≤ ${m(c.buy)}\nLink: ${l?l.url:c.url||''}\nPlease verify print, condition and total cost in CAD before buying.`;
 W.unshift({n:c.name,p:p,t:t,d:new Date().toLocaleDateString('en-CA')});sv();toast('Added to Wishlist');send(t)}
sv();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
